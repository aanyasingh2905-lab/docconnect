<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocConnect – US Doctor Email Autopilot</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7fb;--cd:#fff;--tx:#17202e;--mu:#667085;--bd:#e1e6ef;--ac:#0e7c86;--a2:#e3f4f5;--ok:#15803d;--wr:#b45309;--er:#b91c1c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--cd:#171e27;--tx:#e7ecf3;--mu:#8e9bb0;--bd:#283241;--ac:#35b6c0;--a2:#12313a}}
:root[data-theme="dark"]{--bg:#0e1319;--cd:#171e27;--tx:#e7ecf3;--mu:#8e9bb0;--bd:#283241;--ac:#35b6c0;--a2:#12313a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--cd);border-bottom:1px solid var(--bd);padding:10px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px}.logo b{color:var(--ac)}
.steps{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.st{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
.st i{font-style:normal;background:var(--bd);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.st.on{background:var(--ac);color:#fff;border-color:var(--ac)}.st.on i{background:#fff3;color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}.lead{color:var(--mu);margin:0 0 16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;max-width:100%}
textarea{width:100%;min-height:200px}label{font-size:13px;color:var(--mu);display:block;margin:8px 0 3px}
.b{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:9px 14px;border-radius:9px;cursor:pointer}
.b.p{background:var(--ac);border-color:var(--ac);color:#fff}.b.s{padding:5px 10px;font-size:13px}
.chip{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--a2);border-color:var(--ac);color:var(--ac);font-weight:700}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mu);cursor:pointer}.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd);color:var(--mu)}
.t-replied{background:#dcfce7;color:var(--ok)}.t-opened{background:#fef3c7;color:var(--wr)}.t-bounced,.t-unsubscribed{background:#fee2e2;color:var(--er)}.t-sent{background:var(--a2);color:var(--ac)}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px}.k small{color:var(--mu);display:block}.k b{font-size:26px}
.mu{color:var(--mu)}.warn{background:#fef3c7;color:#78350f;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.pre{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:12px;font-size:14px}
.bars{display:flex;gap:4px;align-items:flex-end;height:110px}.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bars div span{position:absolute;bottom:0;left:0;right:0;background:var(--ok);border-radius:4px 4px 0 0}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:9}

.ic{font-size:17px}.hero{background:linear-gradient(135deg,var(--ac),#0b5d65);color:#fff;border-radius:16px;padding:20px;margin-bottom:16px}.hero h1{color:#fff;margin:0 0 6px}
.ck{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}.ck:last-child{border:0}.ck .n{width:30px;height:30px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:700;flex:none}.ck.done .n{background:var(--ok);color:#fff}
.b.big{padding:13px 20px;font-size:16px}input[type=file]{max-width:100%}
@media(max-width:700px){main{padding:14px 12px 100px}header{padding:8px 14px}h1{font-size:20px}.card{padding:14px}
.steps{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6;flex-wrap:nowrap;justify-content:space-around;gap:0}
.st{flex-direction:column;border:0;border-radius:10px;padding:4px 6px;font-size:11px;gap:0;background:none;min-width:58px}.st.on{background:var(--a2);color:var(--ac)}
table{min-width:0}th,td{white-space:normal;padding:8px 5px;font-size:13px;word-break:break-word}.dt th:nth-child(n+4):nth-child(-n+6),.dt td:nth-child(n+4):nth-child(-n+6),.rt th:nth-child(2),.rt td:nth-child(2){display:none}
input,select,.b{font-size:16px}.b.s{font-size:13px}#toast{bottom:84px;width:90%;text-align:center;border-radius:14px}.row>*{flex:1 1 auto}}
</style></head><body>
<header><div class="logo">🩺 Doc<b>Connect</b></div>
<div class="steps"><button class="st" data-v="home" onclick="go('home')"><span class="ic">🤖</span>Autopilot</button><button class="st" data-v="docs" onclick="go('docs')"><span class="ic">🩺</span>Doctors</button><button class="st" data-v="email" onclick="go('email')"><span class="ic">✉️</span>Emails</button><button class="st" data-v="camp" onclick="go('camp')"><span class="ic">🚀</span>Send</button><button class="st" data-v="res" onclick="go('res')"><span class="ic">📊</span>Results</button></div></header>
<main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),DAY=864e5,pick=a=>a[R(0,a.length-1)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'0%',OK=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e||'');
let S={docs:[],tpls:[],camps:[],ev:[],set:{sender:'',company:'',addr:''}},V={v:'home',sp:'',st:'',ba:'',q:'',sort:'name',dir:1,t:null,pq:null};
try{const x=localStorage.getItem('dc3');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('dc3',JSON.stringify(S))}catch(e){toast('Browser storage is full – download a backup')}};
let tt;function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms)}
if(!S.tpls.length)S.tpls=[{id:1,name:'Introduction',sp:'',sub:'Quick question for {{doctor}}',body:"Dear {{doctor}},\n\nI'm {{sender}} from {{company}}. We work with {{specialty}} physicians in {{state}} and I thought our programme might interest you.\n\nWould you be open to a 10-minute call this week?\n\nBest regards,\n{{sender}}\n{{company}}"},{id:2,name:'Reminder',sp:'',sub:'Re: Quick question for {{doctor}}',body:"Dear {{doctor}},\n\nJust following up on my earlier email. Happy to share details whenever it is convenient for you.\n\nBest regards,\n{{sender}}\n{{company}}"}];
const SP=[['Cardiology',/cardio/i],['Neurology',/neuro/i],['Oncology',/onco|hematol/i],['Orthopedics',/ortho/i],['Dermatology',/derma/i],['Psychiatry',/psych/i],['Radiology',/radiol/i],['Anesthesiology',/anesth/i],['General Surgery',/surg/i],['Internal Medicine',/internal/i],['Family Medicine',/family|general pract/i],['OB/GYN',/ob\W?gyn|obstet|gynec/i],['Emergency Medicine',/emergen/i],['Ophthalmology',/ophthal/i],['ENT',/\bent\b|otolaryn/i],['Urology',/urolog/i],['Endocrinology',/endocr/i],['Gastroenterology',/gastro/i],['Pathology',/pathol/i],['Pediatrics',/pediat|paediat|^child/i]];
const norm=s=>{s=(s||'').trim();for(const[n,r]of SP)if(r.test(s))return n;return s?s.replace(/\b\w/g,c=>c.toUpperCase()):'Unknown'};
function csv(t){const r=[];let w=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){w.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;w.push(c);c='';if(w.some(x=>x.trim()))r.push(w);w=[]}else c+=h}w.push(c);if(w.some(x=>x.trim()))r.push(w);return r}
const toCsv=rows=>rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
async function saveFile(name,data){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code=='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=name;a.click()}
const status=d=>{const c=Object.values(d.c||{});return d.unsub?'unsubscribed':d.bounced?'bounced':c.some(x=>x.rp)?'replied':c.some(x=>x.op)?'opened':c.length?'sent':'new'};
const tag=s=>`<span class="tag t-${s}">${s}</span>`;
const doc=id=>S.docs.find(d=>d.id==id);
function fill(t,d){const ln=(d.name||'').replace(/^Dr\.?\s*/i,'').trim().split(/\s+/).pop(),s=S.set;return t.replace(/{{doctor}}/g,'Dr. '+ln).replace(/{{first_name}}/g,(d.name||'').replace(/^Dr\.?\s*/i,'').split(' ')[0]).replace(/{{specialty}}/g,(d.spec||'').toLowerCase()).replace(/{{state}}/g,d.state||'your state').replace(/{{city}}/g,d.city||'your city').replace(/{{sender}}/g,s.sender||'[Your name]').replace(/{{company}}/g,s.company||'[Your company]')}
const build=(c,d,type)=>{const t=S.tpls.find(x=>x.id==(type=='first'?c.t1:c.t2))||S.tpls[0],s=S.set;return{sub:fill(t.sub,d),body:fill(t.body,d)+`\n\n--\n${s.company||''} ${s.addr?'· '+s.addr:''}\nIf this is not relevant to you, reply STOP and I will not email again.`}};
function queue(c,type){return S.docs.filter(d=>d.spec==c.sp&&OK(d.email)&&!d.unsub&&!d.bounced&&(!c.ba||d.batch==c.ba)&&(()=>{const x=(d.c||{})[c.id];if(type=='first')return !x;return x&&!x.op&&!x.rp&&x.n<=c.mx&&Date.now()-x.last>=c.rd*DAY})())}
const ev=(type,d,c,t)=>S.ev.push({t:t||Date.now(),type,d:d.id,c});
function go(v){V.v=v;V.pq=null;render()}
function render(){document.querySelectorAll('.st').forEach(b=>b.classList.toggle('on',b.dataset.v==V.v));$('#app').innerHTML=({home:vHome,docs:vDocs,email:vEmail,camp:vCamp,res:vRes})[V.v]();if(V.v=='email')upd();save()}
/* ---------- 1 DOCTORS ---------- */
function vDocs(){const sp={};S.docs.forEach(d=>sp[d.spec]=(sp[d.spec]||0)+1);
 const L=a=>[...new Set(a.filter(Boolean))].sort(),states=L(S.docs.map(d=>d.state)),bat=L(S.docs.map(d=>d.batch));
 const r=S.docs.filter(d=>(!V.sp||d.spec==V.sp)&&(!V.st||d.state==V.st)&&(!V.ba||d.batch==V.ba)&&(!V.q||(d.name+d.email+d.city+d.npi).toLowerCase().includes(V.q.toLowerCase()))).sort((a,b)=>((a[V.sort]||'')>(b[V.sort]||'')?1:-1)*V.dir);
 const th=(k,l)=>`<th onclick="V.sort='${k}';V.dir*=-1;render()">${l}${V.sort==k?(V.dir>0?' ▲':' ▼'):''}</th>`;
 return `<h1>Your doctors</h1><p class="lead">Upload your doctor list once. We clean it, remove duplicates and sort every doctor by specialty automatically.</p>
 <div class="card"><div class="row"><label style="margin:0"><input type="file" accept=".csv" onchange="imp(this.files[0])"></label>
 <button class="b" onclick="sample()">Download sample CSV</button><button class="b" onclick="demo()">Load demo doctors</button>${S.docs.length?`<button class="b" onclick="if(confirm('Delete ALL doctors, campaigns and results?')){S.docs=[];S.camps=[];S.ev=[];render()}">Clear all</button>`:''}</div>
 <div class="mu">CSV needs these columns (any order): name, email, specialty, phone, state, city, NPI. The first row must be the column names. Export from your data source (Apollo, NPI registry list, own database) and upload it here.</div></div>
 ${S.docs.length?`<div class="card"><div class="row"><b>Specialty:</b><button class="chip ${V.sp?'':'on'}" onclick="V.sp='';render()">All (${S.docs.length})</button>${Object.entries(sp).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="chip ${V.sp==k?'on':''}" onclick="V.sp='${k}';render()">${k} (${n})</button>`).join('')}</div>
 <div class="row"><input placeholder="Search name, email, NPI…" value="${esc(V.q)}" oninput="V.q=this.value;render();const e=$('#app input[placeholder^=Search]');e.focus();e.setSelectionRange(99,99)"><select onchange="V.st=this.value;render()"><option value="">All states</option>${states.map(s=>`<option ${V.st==s?'selected':''}>${s}</option>`).join('')}</select><select onchange="V.ba=this.value;render()"><option value="">All batches</option>${bat.map(s=>`<option ${V.ba==s?'selected':''}>${esc(s)}</option>`).join('')}</select>
 <button class="b" onclick="saveFile('doctors.csv',toCsv([['name','specialty','email','phone','state','city','npi','batch','status']].concat(${'S.docs'}.filter(d=>(!V.sp||d.spec==V.sp)).map(d=>[d.name,d.spec,d.email,d.phone,d.state,d.city,d.npi,d.batch,status(d)]))))">⬇ Export${V.sp?' '+V.sp:''} list</button></div>
 <div class="mu" style="margin-bottom:8px">${r.length} doctors shown · ${r.filter(d=>OK(d.email)).length} with a valid email</div>
 <div class="tw"><table class="dt"><tr>${th('name','Doctor')}${th('spec','Specialty')}${th('email','Email')}${th('phone','Phone')}${th('state','State')}${th('batch','Batch')}<th>Status</th></tr>${r.slice(0,150).map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.spec)}</td><td>${OK(d.email)?esc(d.email):'<span class="tag t-bounced">no valid email</span>'}</td><td>${esc(d.phone)}</td><td>${esc(d.state)}</td><td class="mu">${esc(d.batch)}</td><td>${tag(status(d))}</td></tr>`).join('')}</table></div>${r.length>150?'<div class="mu">Showing first 150 – use filters or export to see all.</div>':''}</div>`:''}`}
function imp(f){if(!f)return;const rd=new FileReader();rd.onload=async()=>{const rows=csv(String(rd.result));if(rows.length<2)return toast('File looks empty');
 const h=rows[0].map(x=>x.toLowerCase().trim()),ix=re=>h.findIndex(x=>re.test(x));let c={em:ix(/e-?mail/),fn:ix(/first/),ln:ix(/last|surname/),nm:ix(/^(full\s*)?name$|doctor|physician/),sp:ix(/special|taxonomy|department/),ph:ix(/phone|mobile|tel/),st:ix(/^state|region|province/),ct:ix(/city/),np:ix(/npi/)};
 if(c.em<0||c.sp<0||(c.nm<0&&c.fn<0)){try{const sm=await claude.use('sample');if(sm){toast('🤖 AI is reading your columns…',15000);const m=await sm.json(`A CSV of US doctors has headers ${JSON.stringify(rows[0])} and first row ${JSON.stringify(rows[1])}. Return JSON mapping each field to its 0-based column index, or -1 if absent: {"em":email,"fn":first name,"ln":last name,"nm":full name,"sp":specialty,"ph":phone,"st":state,"ct":city,"np":NPI}`,{cache:false});for(const k in c)if(c[k]<0&&Number.isInteger(m[k]))c[k]=m[k]}}catch(e){}}
 if(c.em<0)return toast('Could not find an email column in this file');const seen=new Set(S.docs.map(d=>(d.email||d.npi).toLowerCase()));let add=0,dup=0;const b=f.name.replace('.csv','')+' · '+new Date().toLocaleDateString();
 rows.slice(1).forEach(r=>{const g=i=>i>=0?(r[i]||'').trim():'',em=g(c.em).toLowerCase(),key=em||g(c.np);if(!key)return;if(seen.has(key)){dup++;return}seen.add(key);
 const nm=g(c.nm)||(g(c.fn)+' '+g(c.ln)).trim();S.docs.push({id:Date.now()+add,name:/^dr/i.test(nm)?nm:'Dr. '+nm,email:em,phone:g(c.ph),spec:norm(g(c.sp)),raw:g(c.sp),state:g(c.st),city:g(c.ct),npi:g(c.np),batch:b,c:{}});add++});
 toast(`Imported ${add} doctors, skipped ${dup} duplicates`);render();await aiSort(true)};rd.readAsText(f)}
function sample(){saveFile('sample-doctors.csv',toCsv([['name','email','specialty','phone','state','city','npi'],['Sarah Johnson','sarah@example.org','Pediatrics','555-0101','Texas','Austin','1234567890'],['Michael Lee','michael@example.org','Cardiology','555-0102','California','San Diego','1234567891']]))}
function demo(){const F=['James','Emily','Michael','Sarah','David','Jessica','Robert','Priya','Daniel','Maria','Kevin','Linda'],L=['Smith','Johnson','Brown','Patel','Garcia','Miller','Davis','Lee','Clark','Nguyen'],ST=['Texas','California','Florida','New York','Ohio','Illinois'],SPs=['Pediatrics','Pediatrics','Pediatrics','Cardiology','Neurology','Dermatology','Oncology','Orthopedics'];
 for(let i=0;i<60;i++){const f=pick(F),l=pick(L),s=pick(SPs);S.docs.push({id:Date.now()+i,name:`Dr. ${f} ${l}`,email:`${f}.${l}${i}@demo-clinic.example`.toLowerCase(),phone:'555-01'+R(10,99),spec:s,state:pick(ST),city:'Demo City',npi:''+R(1e9,2e9-1),batch:'Demo list',c:{}})}render()}
/* ---------- 2 EMAIL ---------- */
const cur=()=>S.tpls.find(t=>t.id==V.t)||S.tpls[0];
function vEmail(){const t=cur(),sps=[...new Set(S.docs.map(d=>d.spec))].sort(),s=S.set;V.t=t.id;
 return `<h1>Your emails (saved for reuse)</h1><p class="lead">Write the email with the blue tags below. For every doctor, the tags are replaced automatically with their name, specialty and state.</p>
 <div class="card"><b>Your details</b> <span class="mu">(added to every email footer – required for US anti-spam law)</span><div class="g g2"><div><label>Your name</label><input style="width:100%" value="${esc(s.sender)}" oninput="S.set.sender=this.value;upd()"></div><div><label>Company</label><input style="width:100%" value="${esc(s.company)}" oninput="S.set.company=this.value;upd()"></div><div><label>Business mailing address</label><input style="width:100%" value="${esc(s.addr)}" oninput="S.set.addr=this.value;upd()"></div></div></div>
 <div class="g g2"><div class="card"><div class="row"><select onchange="V.t=+this.value;render()">${S.tpls.map(x=>`<option value="${x.id}" ${x.id==t.id?'selected':''}>${esc(x.name)}${x.sp?' ('+x.sp+')':''}</option>`).join('')}</select><button class="b s" onclick="newT()">+ New email</button><button class="b s" onclick="if(S.tpls.length>1&&confirm('Delete this email?')){S.tpls=S.tpls.filter(x=>x.id!=${t.id});V.t=null;render()}">Delete</button></div>
 <label>Template name (saved automatically)</label><input id="tn" style="width:100%" value="${esc(t.name)}" oninput="upd()">
 <label>For which specialty? (optional)</label><select id="tsp" onchange="upd()"><option value="">Any specialty</option>${sps.map(x=>`<option ${t.sp==x?'selected':''}>${x}</option>`).join('')}</select>
 <label>Subject</label><input id="ts" style="width:100%" value="${esc(t.sub)}" oninput="upd()"><label>Message</label><textarea id="tb" oninput="upd()">${esc(t.body)}</textarea>
 <div class="row" style="margin-top:8px">${['doctor','specialty','state','city','sender','company'].map(k=>`<button class="b s" style="color:var(--ac)" onclick="ins('{{${k}}}')">{{${k}}}</button>`).join('')}</div>
 <div class="row"><input id="ai" placeholder="Purpose, e.g. invite to telehealth shifts" style="flex:1"><button class="b p" onclick="ai()">✨ Write with AI</button></div></div>
 <div class="card"><b>Live preview</b><div class="mu" style="margin-bottom:8px">How it looks to a real doctor${t.sp?' ('+t.sp+')':''}</div><div id="pv" class="pre"></div></div></div>`}
function newT(){const id=Date.now();S.tpls.push({id,name:'New email',sp:'',sub:'Hello {{doctor}}',body:'Dear {{doctor}},\n\n'});V.t=id;render()}
function ins(k){const e=$('#tb'),p=e.selectionStart;e.value=e.value.slice(0,p)+k+e.value.slice(e.selectionEnd);upd();e.focus()}
function upd(){const t=cur();if($('#tn')){t.name=$('#tn').value;t.sp=$('#tsp').value;t.sub=$('#ts').value;t.body=$('#tb').value;const d=S.docs.find(d=>!t.sp||d.spec==t.sp)||{name:'Dr. Sarah Johnson',spec:t.sp||'Pediatrics',state:'Texas',city:'Austin'};
 $('#pv').textContent='To: '+(d.name)+'\nSubject: '+fill(t.sub,d)+'\n\n'+fill(t.body,d)+`\n\n--\n${S.set.company||''} ${S.set.addr?'· '+S.set.addr:''}\nIf this is not relevant to you, reply STOP and I will not email again.`}save()}
async function ai(){const t=cur(),why=$('#ai').value||'introduce our services';try{const sm=await claude.use('sample');if(!sm)return toast('AI writing is only available inside Claude');toast('Writing…');
 const r=await sm(`Write a short, warm, professional cold email (max 110 words) to US ${t.sp||'physicians'} doctors. Purpose: ${why}. Use these placeholders exactly where natural: {{doctor}}, {{specialty}}, {{state}}, {{sender}}, {{company}}. No fake claims. Reply format: first line "SUBJECT: ..." then a blank line then the body only.`,{cache:false});
 const m=r.text.match(/SUBJECT:\s*(.*)\n+([\s\S]*)/i);if(m){t.sub=m[1].trim();t.body=m[2].trim()}else t.body=r.text;render();upd()}catch(e){toast('AI is unavailable right now')}}
/* ---------- 3 SEND ---------- */
function vCamp(){const sps=[...new Set(S.docs.map(d=>d.spec))].sort(),bat=[...new Set(S.docs.map(d=>d.batch))],cn=s=>S.docs.filter(d=>d.spec==s&&OK(d.email)).length,T=S.tpls;
 const form=S.docs.length?`<div class="card"><b>New campaign</b><div class="g g2"><div><label>Campaign name</label><input id="cn" style="width:100%" placeholder="e.g. Pediatricians – October"></div>
 <div><label>Send ONLY to this specialty</label><select id="cs" style="width:100%">${sps.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>Doctor batch</label><select id="cb" style="width:100%"><option value="">All batches</option>${bat.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>
 <div><label>First email</label><select id="c1" style="width:100%">${T.map(t=>`<option value="${t.id}">${esc(t.name)}${t.sp?' ('+t.sp+')':''}</option>`).join('')}</select></div><div><label>Reminder email</label><select id="c2" style="width:100%">${T.map(t=>`<option value="${t.id}" ${t.id==2?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
 <div><label>Remind if no open/reply after (days)</label><input id="cd" type="number" value="4" min="1" style="width:100%"></div><div><label>Maximum reminders</label><input id="cm" type="number" value="2" min="0" max="5" style="width:100%"></div></div>
 <div class="row" style="margin-top:12px"><button class="b p" onclick="newC()">Create campaign</button><span class="mu">Doctors of any other specialty are blocked automatically.</span></div></div>`:'<div class="warn">Add doctors on the Autopilot tab first.</div>';
 const cards=S.camps.map(c=>{const f=queue(c,'first'),rm=queue(c,'rem'),n=S.docs.filter(d=>d.spec==c.sp).length;return `<div class="card"><div class="row"><b style="font-size:17px">${esc(c.name)}</b><span class="tag t-sent">${c.sp} only</span><span class="mu">${c.ba?esc(c.ba):'all batches'}</span><button class="b s" style="margin-left:auto" onclick="if(confirm('Delete campaign?')){S.camps=S.camps.filter(x=>x.id!=${c.id});render()}">Delete</button></div>
 <div class="g"><div class="k"><small>Ready for first email</small><b>${f.length}</b></div><div class="k"><small>Reminders due now</small><b>${rm.length}</b></div><div class="k"><small>Blocked (other specialties)</small><b>${S.docs.length-n}</b></div></div>
 <div class="row" style="margin-top:12px"><button class="b p" ${f.length?'':'disabled'} onclick="V.pq={c:${c.id},t:'first'};render();scrollTo(0,document.body.scrollHeight)">① Send first emails (${f.length})</button><button class="b" ${rm.length?'':'disabled'} onclick="V.pq={c:${c.id},t:'rem'};render();scrollTo(0,document.body.scrollHeight)">② Send reminders (${rm.length})</button></div></div>`}).join('');
 let panel='';if(V.pq){const c=S.camps.find(x=>x.id==V.pq.c),q=queue(c,V.pq.t);if(c)panel=`<div class="card" style="border-color:var(--ac)"><b>${V.pq.t=='first'?'First emails':'Reminders'} – ${esc(c.name)} · ${q.length} ${c.sp} doctors</b>
 <p class="mu">Choose how to send. <b>Fastest:</b> download the file and upload it to your mail-merge / sending tool (Gmail mail merge, Apollo, Instantly, Mailchimp…). <b>Small batches:</b> use the Gmail draft links. When done, press "Mark as sent" so the system starts tracking.</p>
 <div class="row"><button class="b p" onclick="dlq(${c.id},'${V.pq.t}')">⬇ Download mail-merge file (CSV)</button><button class="b" onclick="mk(${c.id},'${V.pq.t}')">✔ Mark all as sent</button></div>
 <div class="pre" style="margin-bottom:10px">${esc('Subject: '+build(c,q[0]||{},V.pq.t).sub+'\n\n'+build(c,q[0]||{},V.pq.t).body)}</div>
 <div class="tw"><table><tr><th>Doctor</th><th>Email</th><th></th></tr>${q.slice(0,100).map(d=>{const m=build(c,d,V.pq.t);return `<tr><td>${esc(d.name)}</td><td>${esc(d.email)}</td><td><a class="b s" target="_blank" rel="noopener" href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(d.email)}&su=${encodeURIComponent(m.sub)}&body=${encodeURIComponent(m.body)}">Open Gmail draft</a></td></tr>`}).join('')}</table></div></div>`}
 return `<h1>Send &amp; remind</h1><p class="lead">Create a campaign for one specialty. The system builds a personalised email for every doctor and tells you who needs a reminder.</p>${form}${cards}${panel}`}
function newC(){const g=i=>$('#'+i).value;if(!g('cn'))return toast('Give the campaign a name');const t=S.tpls.find(x=>x.id==g('c1')),sp=g('cs');if(t.sp&&t.sp!=sp&&!confirm(`That email is written for ${t.sp}, but you picked ${sp}. Continue?`))return;
 S.camps.unshift({id:Date.now(),name:g('cn'),sp,ba:g('cb'),t1:+g('c1'),t2:+g('c2'),rd:+g('cd'),mx:+g('cm')});render()}
function dlq(id,type){const c=S.camps.find(x=>x.id==id);saveFile(`${c.name}-${type}.csv`,toCsv([['email','name','specialty','state','subject','body']].concat(queue(c,type).map(d=>{const m=build(c,d,type);return[d.email,d.name,d.spec,d.state,m.sub,m.body]}))))}
function mk(id,type){const c=S.camps.find(x=>x.id==id),q=queue(c,type);if(!q.length)return;q.forEach(d=>{d.c=d.c||{};const x=d.c[id];if(x){x.n++;x.last=Date.now();ev('reminder',d,id)}else{d.c[id]={n:1,last:Date.now(),op:0,rp:0};ev('sent',d,id)}});toast(q.length+' emails marked as sent – tracking started');V.pq=null;render()}
/* ---------- 4 RESULTS ---------- */
function mark(did,type,cid){const d=doc(did);d.c=d.c||{};cid=cid||Object.keys(d.c).sort((a,b)=>d.c[b].last-d.c[a].last)[0];if(!cid)return;const x=d.c[cid];if(type=='opened')x.op=1;if(type=='replied'){x.rp=1;x.op=1}if(type=='bounced')d.bounced=1;if(type=='unsub')d.unsub=1;ev(type=='unsub'?'unsub':type,d,+cid)}
function vRes(){const E=S.ev,n=t=>E.filter(e=>e.type==t).length,sent=n('sent')+n('reminder'),op=n('opened'),rp=n('replied'),bo=n('bounced'),un=n('unsub');
 const days=[];for(let i=13;i>=0;i--){const a=Date.now()-i*DAY,s=new Date(a).setHours(0,0,0,0),f=e=>e.t>=s&&e.t<s+DAY;days.push([E.filter(e=>f(e)&&(e.type=='sent'||e.type=='reminder')).length,E.filter(e=>f(e)&&e.type=='replied').length])}
 const mx=Math.max(1,...days.map(d=>d[0])),grp=(f)=>{const m={};E.forEach(e=>{const d=doc(e.d);if(!d)return;const k=f(d,e);if(!k)return;const o=m[k]=m[k]||{s:0,o:0,r:0,b:0};if(e.type=='sent'||e.type=='reminder')o.s++;if(e.type=='opened')o.o++;if(e.type=='replied')o.r++;if(e.type=='bounced')o.b++});return Object.entries(m)};
 const tb=(rows)=>`<div class="tw"><table><tr><th>Name</th><th>Sent</th><th>Open rate</th><th>Reply rate</th><th>Bounce</th></tr>${rows.map(([k,o])=>`<tr><td>${esc(k)}</td><td>${o.s}</td><td>${pct(o.o,o.s)}</td><td>${pct(o.r,o.s)}</td><td>${pct(o.b,o.s)}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No data yet</td></tr>'}</table></div>`;
 const due=S.camps.reduce((a,c)=>a+queue(c,'rem').length,0),sd=S.docs.filter(d=>Object.keys(d.c||{}).length);
 return `<h1>Results</h1><p class="lead">Every number updates by itself when you mark sends or import results from your sending tool.</p>
 ${due?`<div class="warn">⏰ ${due} doctors have not opened or replied and are due a reminder. <a href="#" onclick="go('camp');return false">Go to Send</a></div>`:''}
 <div class="g"><div class="k"><small>Emails sent</small><b>${sent}</b></div><div class="k"><small>Open rate</small><b>${pct(op,sent)}</b></div><div class="k"><small>Reply rate</small><b>${pct(rp,sent)}</b></div><div class="k"><small>Bounce rate</small><b>${pct(bo,sent)}</b></div><div class="k"><small>Interested (AI)</small><b>${S.docs.filter(d=>d.note&&d.note.i=='interested').length}</b></div><div class="k"><small>Unsubscribed</small><b>${un}</b></div><div class="k"><small>Reminders due</small><b>${due}</b></div></div>
 <div class="g g2" style="margin-top:16px"><div class="card"><b>Last 14 days</b> <span class="mu">(sent, with replies in green)</span><div class="bars" style="margin-top:10px">${days.map(d=>`<div style="height:${d[0]/mx*100}%"><span style="height:${d[0]?d[1]/d[0]*100:0}%"></span></div>`).join('')}</div></div>
 <div class="card"><b>Update results automatically</b><p class="mu">Export the report from your sending tool (CSV with an <b>email</b> column plus <b>opened / replied / bounced / unsubscribed</b> columns marked yes/1) and upload it.</p><input type="file" accept=".csv" onchange="impR(this.files[0])">${S.docs.length&&!S.ev.length?'<div class="row" style="margin-top:10px"><button class="b" onclick="simR()">Demo: simulate some responses</button></div>':''}</div></div>
 <div class="g g2"><div class="card"><b>By specialty</b>${tb(grp(d=>d.spec))}</div><div class="card"><b>By campaign</b>${tb(grp((d,e)=>(S.camps.find(c=>c.id==e.c)||{}).name))}</div></div>
 <div class="card"><b>Doctor responses</b> <span class="mu">– or click to record manually</span><div class="tw"><table class="rt"><tr><th>Doctor</th><th>Specialty</th><th>Status</th><th>Record</th></tr>${sd.slice(0,80).map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.spec)}</td><td>${tag(status(d))}${d.note?`<div class="mu" style="font-size:12px">${esc(d.note.i)}: ${esc(d.note.s)}</div>`:''}</td><td><button class="b s" onclick="mark(${d.id},'opened');render()">Opened</button> <button class="b s" onclick="mark(${d.id},'replied');render()">Replied</button> <button class="b s" onclick="mark(${d.id},'bounced');render()">Bounced</button> <button class="b s" onclick="mark(${d.id},'unsub');render()">Unsubscribe</button></td></tr>`).join('')||'<tr><td colspan=4 class="mu">Send your first campaign and doctors appear here.</td></tr>'}</table></div></div>`}
function impR(f){if(!f)return;const rd=new FileReader();rd.onload=()=>{const r=csv(String(rd.result)),h=r[0].map(x=>x.toLowerCase()),ix=re=>h.findIndex(x=>re.test(x)),e=ix(/e-?mail/),o=ix(/open/),p=ix(/repl/),b=ix(/bounce/),u=ix(/unsub/),yes=v=>v&&!/^(0|no|false|n|)$/i.test(v.trim());let k=0;
 if(e<0)return toast('No email column found');r.slice(1).forEach(w=>{const d=S.docs.find(x=>x.email==(w[e]||'').toLowerCase().trim());if(!d||!Object.keys(d.c||{}).length)return;if(yes(w[o]))mark(d.id,'opened');if(yes(w[p]))mark(d.id,'replied');if(yes(w[b]))mark(d.id,'bounced');if(yes(w[u]))mark(d.id,'unsub');k++});toast(k+' doctors updated');render()};rd.readAsText(f)}
function simR(){S.docs.forEach(d=>{if(!Object.keys(d.c||{}).length)return;const r=Math.random();if(r<.04)mark(d.id,'bounced');else if(r<.5){mark(d.id,'opened');if(Math.random()<.25)mark(d.id,'replied')}});render()}

const CANON=SP.map(x=>x[0]);
async function aiSort(q){const raws=[...new Set(S.docs.filter(d=>!CANON.includes(d.spec)&&!d.ai).map(d=>d.raw||d.spec))].slice(0,80);if(!raws.length){if(!q)toast('Everything is already sorted ✔');return}
 try{const sm=await claude.use('sample');if(!sm){if(!q)toast('AI sorting works inside Claude only');return}toast('🤖 AI is sorting specialties…',25000);
 const m=await sm.json(`Map each raw US doctor specialty text to ONE standard primary specialty name (e.g. Pediatrics, Cardiology, Pulmonology, Nephrology, Rheumatology, Family Medicine). Subspecialties map to their own field (Pediatric Cardiology -> Cardiology). Use "Unknown" only if impossible. Return a JSON object {raw: standard}. Raw list: ${JSON.stringify(raws)}`,{cache:false});
 let k=0;S.docs.forEach(d=>{const v=m[d.raw||d.spec];if(!CANON.includes(d.spec)&&!d.ai&&v){d.spec=String(v);d.ai=1;k++}});toast(`🤖 AI sorted ${k} doctors by specialty`)}catch(e){toast('AI could not sort right now – press the button to retry')}render()}
async function autoSetup(){const s=S.set;if(!s.sender||!s.company||!s.addr)return toast('Fill in your name, company and address first (required by US law)',4000);
 const need=[...new Set(S.docs.filter(d=>OK(d.email)&&d.spec!='Unknown').map(d=>d.spec))].filter(x=>!S.camps.some(c=>c.sp==x));if(!need.length)return toast('Every specialty already has a campaign ✔');
 const out={};try{const sm=await claude.use('sample');if(sm){for(let i=0;i<need.length;i+=4){const part=need.slice(i,i+4);toast(`🤖 Writing emails for ${part.join(', ')}…`,40000);
 const r=await sm.json(`Write cold outreach emails to US physicians. Offer: ${s.offer||'our services'}. For each specialty write a first email (max 90 words, warm, professional, relevant to that specialty, one clear ask) and a short reminder (max 40 words). Use these placeholders exactly: {{doctor}}, {{state}}, {{sender}}, {{company}}. Do not invent facts or numbers. Return a JSON array: [{"specialty":"","subject":"","body":"","rsubject":"","rbody":""}]. Specialties: ${JSON.stringify(part)}`,{cache:false});if(Array.isArray(r))r.forEach(x=>out[x.specialty]=x)}}}catch(e){}
 need.forEach((sp,i)=>{const o=out[sp]||{},id=Date.now()+i*3;S.tpls.push({id,name:sp+' – first email',sp,sub:o.subject||S.tpls[0].sub,body:o.body||S.tpls[0].body},{id:id+1,name:sp+' – reminder',sp,sub:o.rsubject||S.tpls[1].sub,body:o.rbody||S.tpls[1].body});S.camps.push({id:id+2,name:sp+' outreach',sp,ba:'',t1:id,t2:id+1,rd:4,mx:2})});
 toast(`✔ ${need.length} campaigns ready${Object.keys(out).length?'':' (standard emails – AI unavailable)'}`,4000);render()}
const todays=()=>{const L=[];S.camps.forEach(c=>['first','rem'].forEach(t=>queue(c,t).forEach(d=>L.push({c,t,d}))));return L};
function dlAll(){const L=todays();if(!L.length)return toast('Nothing to send today 🎉');saveFile('todays-emails-'+new Date().toISOString().slice(0,10)+'.csv',toCsv([['email','name','specialty','state','campaign','type','subject','body']].concat(L.map(({c,t,d})=>{const m=build(c,d,t);return[d.email,d.name,d.spec,d.state,c.name,t=='first'?'first email':'reminder',m.sub,m.body]}))))}
function mkAll(){const L=todays();if(!L.length)return;L.forEach(({c,t,d})=>{d.c=d.c||{};const x=d.c[c.id];if(x){x.n++;x.last=Date.now();ev('reminder',d,c.id)}else{d.c[c.id]={n:1,last:Date.now(),op:0,rp:0};ev('sent',d,c.id)}});toast(L.length+' emails marked as sent – tracking started',4000);render()}
async function aiReplies(){const t=$('#rp').value.trim();if(!t)return toast('Paste the replies first');try{const sm=await claude.use('sample');if(!sm)return toast('AI reading works inside Claude only');toast('🤖 Reading replies…',40000);
 const r=await sm.json(`These are email replies from US doctors, pasted from an inbox. For each reply return the sender email ("" if unknown), doctor name, intent (one of: interested, not_interested, unsubscribe, out_of_office, other) and a summary under 12 words. Treat STOP / remove me / unsubscribe as unsubscribe. JSON array only: [{"email":"","name":"","intent":"","summary":""}]. Replies:\n${t.slice(0,12000)}`,{cache:false});
 let k=0,miss=0;(Array.isArray(r)?r:[]).forEach(x=>{const e=(x.email||'').toLowerCase().trim(),nm=(x.name||'').toLowerCase().replace(/^dr\.?\s*/,'').trim(),d=S.docs.find(d=>e&&d.email==e)||(nm&&S.docs.find(d=>d.name.toLowerCase().replace(/^dr\.?\s*/,'')==nm));if(!d||!Object.keys(d.c||{}).length){miss++;return}
 d.note={i:x.intent,s:x.summary};if(x.intent=='unsubscribe')mark(d.id,'unsub');else if(x.intent=='out_of_office')mark(d.id,'opened');else mark(d.id,'replied');k++});
 toast(`🤖 ${k} replies recorded${miss?`, ${miss} not matched to a doctor`:''}`,4000);$('#rp').value='';render()}catch(e){toast('AI could not read the replies – try again')}}
function vHome(){const s=S.set,n=S.docs.length,okc=S.docs.filter(d=>OK(d.email)).length,sps=[...new Set(S.docs.filter(d=>OK(d.email)).map(d=>d.spec))],loose=S.docs.filter(d=>!CANON.includes(d.spec)&&!d.ai).length,need=sps.filter(x=>x!='Unknown'&&!S.camps.some(c=>c.sp==x)).length,L=todays(),f=L.filter(x=>x.t=='first').length;
 const step=(i,done,t,b)=>`<div class="ck ${done?'done':''}"><div class="n">${done?'✓':i}</div><div style="flex:1;min-width:0"><b>${t}</b><div style="margin-top:6px">${b}</div></div></div>`;
 return `<div class="hero"><h1>🤖 Autopilot</h1><div style="opacity:.9">Upload your doctor list. AI sorts it by specialty, writes every email, tells you who needs a reminder and reads the replies.</div></div>
 <div class="card"><b>One-time setup</b><div class="g g2"><div><label>Your name</label><input style="width:100%" value="${esc(s.sender)}" oninput="S.set.sender=this.value;save()"></div><div><label>Company</label><input style="width:100%" value="${esc(s.company)}" oninput="S.set.company=this.value;save()"></div><div><label>Business mailing address</label><input style="width:100%" value="${esc(s.addr)}" oninput="S.set.addr=this.value;save()"></div><div><label>What are you offering doctors? (AI uses this)</label><input style="width:100%" placeholder="e.g. flexible telehealth shifts" value="${esc(s.offer)}" oninput="S.set.offer=this.value;save()"></div></div></div>
 <div class="card">${step(1,n>0,'Upload your US doctor list (CSV)',`<input type="file" accept=".csv,text/csv,text/plain" onchange="imp(this.files[0])"><div class="mu" style="margin:6px 0">${n?`${n} doctors · ${okc} with valid email · ${sps.length} specialties`:'Any column order is fine – AI figures it out. Duplicates are removed automatically.'}</div>${n?'':'<button class="b s" onclick="demo()">Try with demo data</button>'}`)}
 ${step(2,n>0&&!loose,'AI sorts every doctor by specialty',loose?`<button class="b p" onclick="aiSort()">🤖 Sort ${loose} doctors with AI</button>`:'<span class="mu">Done automatically on upload.</span>')}
 ${step(3,n>0&&!need&&S.camps.length>0,'AI writes the emails and creates one campaign per specialty',need?`<button class="b p big" onclick="autoSetup()">🤖 Set up ${need} campaign${need>1?'s':''}</button><div class="mu" style="margin-top:6px">Each specialty only ever gets its own email. Edit any email later in the Emails tab.</div>`:'<span class="mu">'+S.camps.length+' campaigns ready (saved emails are reused).</span>')}
 ${step(4,false,"Today's emails",L.length?`<b>${f}</b> first emails + <b>${L.length-f}</b> reminders are due today.<div class="row" style="margin-top:8px"><button class="b p" onclick="dlAll()">⬇ Download today's file</button><button class="b" onclick="mkAll()">✔ I sent them – start tracking</button></div><div class="mu">Upload the file to your sending tool (Gmail mail merge, Apollo, Instantly…). Or use Gmail drafts in the Send tab.</div>`:'<span class="mu">Nothing due today. Reminders appear here automatically.</span>')}
 ${step(5,false,'AI tracks the replies',`<textarea id="rp" style="min-height:90px" placeholder="Paste the replies from your inbox here…"></textarea><div class="row" style="margin-top:8px"><button class="b p" onclick="aiReplies()">🤖 Read replies</button><button class="b" onclick="go('res')">See results</button></div><div class="mu">AI finds the doctor, marks replied / interested / unsubscribed and stops further reminders.</div>`)}</div>`}
render();
</script></body></html>
